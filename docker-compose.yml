# Host ports are deliberately non-default: the sibling bg-remover stack binds
# 6379 (redis). The offset lets both run at once.
# Inside the compose network everything uses standard ports.
#
# Every published port binds 127.0.0.1 explicitly. Docker's default is 0.0.0.0, which
# on a public host would expose Postgres (password `intent`), an unauthenticated Redis,
# MinIO on default credentials, and the free /runs API -- and Docker publishes ports by
# writing its own iptables rules, so a host firewall like UFW does not cover them.
# Anything reachable from outside must arrive through the reverse proxy.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: intent
      POSTGRES_PASSWORD: intent
      POSTGRES_DB: intent_miner
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intent -d intent_miner"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # No object store. The spec called for archiving raw fetched pages to S3, and the
  # code to do it was never written: `raw_key` is passed as None at both save_fetched
  # call sites, boto3 was imported nowhere, and the S3 settings were read by nothing.
  # Two containers, a volume and a dependency for a column that is always NULL.
  # The `raw_key` column stays -- it costs nothing and is the seam if raw archiving is
  # ever actually wanted.

  # api and every worker run the SAME image and must share one `image:` name. Without
  # it, `build: .` on six services builds six identical images -- and Compose builds
  # them in parallel, so six copies of `playwright install chromium` run at once and the
  # daemon OOM-kills the build (exit 137). One name, one build, one image on disk.
  api:
    build: .
    image: intent-miner:local
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql://intent:intent@postgres:5432/intent_miner
      REDIS_URL: redis://redis:6379/0
    ports:
      # Loopback only -- nginx is the sole public door, and it exposes /a2mcp/* alone.
      # Published on 0.0.0.0 this would serve the free /runs API next to the paid one:
      # same pipeline, same LLM and SERP spend, no payment.
      #
      # Host side only: set API_PORT in .env to move it (nginx must proxy to the same
      # number). The container always listens on 8000 -- see `command:` above -- so the
      # right side never changes, and neither does anything inside the compose network.
      - "127.0.0.1:${API_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  # One worker service per queue. Splitting them is what keeps a slow fetch lane
  # from starving the LLM lanes, and lets each scale independently.
  worker-expand:
    build: .
    image: intent-miner:local
    command: dramatiq worker worker --processes 1 --threads 2 --queues expand
    env_file: .env
    environment: &worker_env
      DATABASE_URL: postgresql://intent:intent@postgres:5432/intent_miner
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  # Sized to the SERP ceiling, not to the CPU. Serper allows 5 requests/second, so the
  # old 2x16=32 threads could not do more work -- they just queued 28 rate-limit
  # requeues per second behind the 4 that got through. 6 threads at ~0.3-0.6s/call
  # saturates 4/s with headroom for a slow response.
  worker-discover:
    build: .
    image: intent-miner:local
    command: dramatiq worker worker --processes 1 --threads 6 --queues discover
    env_file: .env
    environment: *worker_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  worker-fetch:
    build: .
    image: intent-miner:local
    command: dramatiq worker worker --processes 2 --threads 16 --queues fetch
    env_file: .env
    environment: *worker_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  # LinkedIn on its own low-concurrency queue. LinkedIn throttles an IP under crawl
  # volume (a full run's LinkedIn candidates came back as gated 200s with no body), so
  # it must be paced -- 2 concurrent, plus per-fetch jitter, keeps it under the radar.
  # Quora stays on the fast `fetch` queue above.
  worker-fetch-linkedin:
    build: .
    image: intent-miner:local
    command: dramatiq worker worker --processes 1 --threads 2 --queues fetch_linkedin
    env_file: .env
    environment: *worker_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  worker-score:
    build: .
    image: intent-miner:local
    command: dramatiq worker worker --processes 2 --threads 8 --queues score
    env_file: .env
    environment: *worker_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgdata:
