# Host ports are deliberately non-default: the sibling bg-remover stack binds
# 6379 (redis) and 9000/9001 (minio). These offsets let both run at once.
# Inside the compose network everything uses standard ports.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: intent
      POSTGRES_PASSWORD: intent
      POSTGRES_DB: intent_miner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intent -d intent_miner"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/intent-raw &&
      echo 'bucket ready'
      "

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql://intent:intent@postgres:5432/intent_miner
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  # One worker service per queue. Splitting them is what keeps a slow fetch lane
  # from starving the LLM lanes, and lets each scale independently.
  worker-expand:
    build: .
    command: dramatiq worker worker --processes 1 --threads 2 --queues expand
    env_file: .env
    environment: &worker_env
      DATABASE_URL: postgresql://intent:intent@postgres:5432/intent_miner
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  worker-discover:
    build: .
    command: dramatiq worker worker --processes 2 --threads 16 --queues discover
    env_file: .env
    environment: *worker_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  worker-fetch:
    build: .
    command: dramatiq worker worker --processes 2 --threads 16 --queues fetch
    env_file: .env
    environment: *worker_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  worker-score:
    build: .
    command: dramatiq worker worker --processes 2 --threads 8 --queues score
    env_file: .env
    environment: *worker_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgdata:
  miniodata:
